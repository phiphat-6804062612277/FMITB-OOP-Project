plugins {
    id 'java'
    id 'application'
}

group = 'com.fmitb'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

application {
    mainClass = 'Main'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'Main',
            'Implementation-Title': 'Five Minutes In The Bathroom',
            'Implementation-Version': project.version
        )
    }
}
